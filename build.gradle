plugins { id 'fabric-loom' version '1.17-SNAPSHOT' }
version = '2.0.0'
group = 'com.friendradar'
base { archivesName = 'friendradar-pro-26.2' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:26.2'
 modImplementation 'net.fabricmc:fabric-loader:0.19.3'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
